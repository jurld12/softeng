version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: healio-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: healio_dev_password
      MONGO_INITDB_DATABASE: healio
    volumes:
      - healio-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - healio-network

  mongo-restore:
    image: mongo:7.0
    container_name: healio-mongo-restore
    depends_on:
      - mongodb
    volumes:
      - ./mongo-backup:/data/backup
    networks:
      - healio-network
    command: >
      sh -c "
        mongorestore --host mongodb --username admin --password healio_dev_password --authenticationDatabase admin --db healio --drop /data/backup/healio &&
        echo 'MongoDB data restored successfully.'
      "

volumes:
  healio-data:
    name: healio-data

networks:
  healio-network:
    name: healio-network
    driver: bridge

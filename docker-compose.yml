version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: healio-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: healio_dev_password
      MONGO_INITDB_DATABASE: healio
    volumes:
      - healio-data:/data/db
    networks:
      - healio-network

volumes:
  healio-data:
    name: healio-data

networks:
  healio-network:
    name: healio-network
    driver: bridge

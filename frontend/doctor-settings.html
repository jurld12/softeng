<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healio - Doctor Settings</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/dashboard-bootstrap.css">
    <link rel="stylesheet" href="css/doctor-settings.css">
</head>
<body class="doctor-settings-body">
    <main class="main-content doctor-settings-main">
        <header class="dashboard-header">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap">
                    <div>
                        <h1 class="greeting-title mb-1">Doctor Settings</h1>
                        <p class="greeting-subtitle mb-0">Update your profile details and change your password.</p>
                    </div>

                    <div class="d-flex gap-2 align-items-center flex-wrap">
                        <a class="btn btn-outline-secondary" href="doctor-dashboard.html">
                            <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
                        </a>
                        <button class="btn-icon" id="logoutButton" type="button" aria-label="Logout">
                            <i class="bi bi-box-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div class="container-fluid px-4 pb-4">
            <section class="doctor-settings-status mb-4" id="settingsStatus" hidden></section>

            <div class="row g-4">
                <div class="col-12 col-xl-7">
                    <section class="section-card doctor-settings-card h-100">
                        <div class="doctor-settings-card__header">
                            <h2 class="section-title mb-1">Profile Information</h2>
                            <p class="section-subtitle mb-0">Manage your doctor account details.</p>
                        </div>

                        <form id="doctorProfileForm" class="row g-3 mt-1">
                            <div class="col-md-6">
                                <label class="form-label" for="doctorNameInput">Full name</label>
                                <input class="form-control" id="doctorNameInput" type="text" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="doctorSpecialtyInput">Specialty</label>
                                <input class="form-control" id="doctorSpecialtyInput" type="text" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="doctorEmailInput">Email</label>
                                <input class="form-control" id="doctorEmailInput" type="email" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="doctorPhoneInput">Phone</label>
                                <input class="form-control" id="doctorPhoneInput" type="tel" placeholder="Optional">
                            </div>
                            <div class="col-12 d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary" id="saveDoctorProfileButton">
                                    <i class="bi bi-check2-circle me-2"></i>Save profile
                                </button>
                            </div>
                        </form>
                    </section>
                </div>

                <div class="col-12 col-xl-5">
                    <section class="section-card doctor-settings-card h-100">
                        <div class="doctor-settings-card__header">
                            <h2 class="section-title mb-1">Change Password</h2>
                            <p class="section-subtitle mb-0">Use a strong password with at least 8 characters.</p>
                        </div>

                        <form id="doctorPasswordForm" class="row g-3 mt-1">
                            <div class="col-12">
                                <label class="form-label" for="currentPasswordInput">Current password</label>
                                <input class="form-control" id="currentPasswordInput" type="password" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="newPasswordInput">New password</label>
                                <input class="form-control" id="newPasswordInput" type="password" minlength="8" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="confirmPasswordInput">Confirm new password</label>
                                <input class="form-control" id="confirmPasswordInput" type="password" minlength="8" required>
                            </div>
                            <div class="col-12 d-flex justify-content-end">
                                <button type="submit" class="btn btn-primary" id="changeDoctorPasswordButton">
                                    <i class="bi bi-shield-lock me-2"></i>Update password
                                </button>
                            </div>
                        </form>
                    </section>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/doctor-settings.js"></script>
</body>
</html>

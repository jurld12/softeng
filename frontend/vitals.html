<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healio - Vitals</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Theme CSS -->
    <link rel="stylesheet" href="css/theme.css">
    
    <!-- Custom Dashboard CSS -->
    <link rel="stylesheet" href="css/dashboard-bootstrap.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="d-flex align-items-center gap-3">
                <div class="logo-icon bg-gradient-primary">
                    <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
                        <path d="M16 2L16 30M2 16L30 16" stroke="white" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                </div>
                <span class="logo-text">Healio</span>
            </div>
        </div>

        <nav class="nav-menu">
            <a href="dashboard-v2.html" class="nav-item-custom">
                <i class="bi bi-house-door-fill"></i>
                <span>Dashboard</span>
            </a>
            <a href="#" class="nav-item-custom">
                <i class="bi bi-file-medical"></i>
                <span>Health Records</span>
            </a>
            <a href="vitals.html" class="nav-item-custom active">
                <i class="bi bi-heart-pulse"></i>
                <span>Vitals</span>
            </a>
            <a href="#" class="nav-item-custom">
                <i class="bi bi-bar-chart-line"></i>
                <span>Analytics</span>
            </a>
            <a href="appointments.html" class="nav-item-custom">
                <i class="bi bi-calendar-check"></i>
                <span>Appointments</span>
            </a>
            <a href="medications.html" class="nav-item-custom">
                <i class="bi bi-capsule"></i>
                <span>Medications</span>
            </a>
            <a href="#" class="nav-item-custom">
                <i class="bi bi-question-circle"></i>
                <span>Help & Support</span>
            </a>
            <a href="settings.html" class="nav-item-custom">
                <i class="bi bi-gear"></i>
                <span>Settings</span>
            </a>
        </nav>

        <div class="sidebar-user">
            <div class="d-flex align-items-center gap-3">
                <img src="https://ui-avatars.com/api/?name=User&background=7c3aed&color=fff" alt="Profile" class="rounded-circle" width="40" height="40" id="sidebarUserAvatar">
                <div class="flex-grow-1">
                    <div class="fw-semibold text-dark small" id="sidebarUserName">Loading...</div>
                    <div class="text-muted" style="font-size: 12px;" id="sidebarUserEmail">Loading...</div>
                </div>
                <button class="btn btn-sm btn-light" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="dashboard-header">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h1 class="greeting-title mb-1">
                            <i class="bi bi-heart-pulse me-2"></i>Vitals Management
                        </h1>
                        <p class="greeting-subtitle mb-0">Track and monitor all your health metrics</p>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" id="savePreferences">
                            <i class="bi bi-check-lg me-2"></i>Save Preferences
                        </button>
                    </div>
                </div>
            </div>
        </div>

        
        <div class="dashboard-content">
            <div class="container-fluid">
                <!-- Vitals List -->
                <div class="row g-4">
                    <div class="col-12">
                        <div id="vitalsContainer">
                            <!-- Vitals will be loaded here -->
                            <div class="col-12 text-center text-muted py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-3">Loading vitals...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Vitals JS -->
    <script src="js/vitals.js"></script>
</body>
</html>
